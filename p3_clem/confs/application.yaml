apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-will42
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/clemllovio/iot_cllovio
    targetRevision: HEAD
    path: confs
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true