apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-will42
  labels:
    app: app-will42
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-will42
  template:
    metadata:
      labels:
        app: app-will42
    spec:
      containers:
      - name: app-will42
        image: wil42/playground:v1
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: app-will42-service
spec:
  selector:
    app: app-will42
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8888